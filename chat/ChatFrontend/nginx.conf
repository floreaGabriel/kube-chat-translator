server {
    listen 80;
    
    # Access and error logs
    access_log /var/log/nginx/frontend_access.log;
    error_log /var/log/nginx/frontend_error.log debug;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files for SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # IMPORTANT: Proxy pentru chatHub direct fără rewrite
    location /chatHub {
        proxy_pass http://chat-backend-service:88/chatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        
        access_log /var/log/nginx/chat_backend_access.log;
        error_log /var/log/nginx/chat_backend_error.log debug;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Handle 404 errors for SPA
    error_page 404 /index.html;
}
