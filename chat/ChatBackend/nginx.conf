server {
    listen 80;
    server_name localhost;

    # Access and error logs
    access_log /var/log/nginx/app_access.log;
    error_log /var/log/nginx/app_error.log debug;

    # Setări globale pentru WebSocket - foarte importante
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 75s;

    # Ruta principală
    location / {
        # Forward to the .NET app running in the same container
        proxy_pass http://localhost:5000;
    }

    # Rută specifică pentru chatHub
    location = /chatHub {
        proxy_pass http://localhost:5000/chatHub;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:5000/health;
    }

    # Redis health check
    location /health/redis {
        proxy_pass http://localhost:5000/health/redis;
    }
}
