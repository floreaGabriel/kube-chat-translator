# CHAT_BACKEND 

# apiVersion: v1
# kind: Service
# metadata:
#   name: chat-backend-service
# spec:
#   selector:
#     app: chat-backend
#   ports:
#   - port: 88
#     targetPort: 80
#   type: ClusterIP

apiVersion: v1
kind: Service
metadata:
  name: chat-backend-service
  annotations:
    service.alpha.kubernetes.io/app-protocols: '{"http":"WS"}'
spec:
  selector:
    app: chat-backend
  ports:
  - port: 88
    targetPort: 80
    name: http
  type: ClusterIP
--- 

# CHAT_FRONTEND

# apiVersion: v1
# kind: Service
# metadata:
#   name: chat-frontend-service
# spec:
#   selector:
#     app: chat-frontend
#   ports:
#   - port: 90
#     targetPort: 90
#     nodePort: 30090
#   type: NodePort

apiVersion: v1
kind: Service
metadata:
  name: chat-frontend-service
spec:
  selector:
    app: chat-frontend
  ports:
  - port: 90
    targetPort: 80
    nodePort: 30090
  type: NodePort

---

# REDIS SERVICE
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
