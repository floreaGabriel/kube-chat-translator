apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend-deployment
  labels:
    app: chat-frontend
spec:
  replicas: 1  # 1 replică așa cum specifică cerința
  selector:
    matchLabels:
      app: chat-frontend
  template:
    metadata:
      labels:
        app: chat-frontend
    spec:
      containers:
      - name: chat-frontend
        image: gabrielflorea/chat-frontend:latest  # Înlocuiește cu imaginea ta
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: REACT_APP_API_URL
          value: "http://chat-backend-service:88"  # URL-ul backend-ului (serviciul din kubernetes)
---
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend-service
spec:
  selector:
    app: chat-frontend
  ports:
  - port: 90  # Port extern conform cerinței
    targetPort: 80  # Portul containerului
    nodePort: 30090  # Port expus pe nod (între 30000-32767)
  type: NodePort  # NodePort pentru acces extern