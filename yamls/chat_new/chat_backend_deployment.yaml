apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend-deployment
  labels:
    app: chat-backend
spec:
  replicas: 3  # 3 replici așa cum specifică cerința
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      containers:
      - name: chat-backend
        image: gabrielflorea/chat-backend:latest  # Înlocuiește cu imaginea ta
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: Redis__ConnectionString
          value: "redis-service:6379,abortConnect=false"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend-service
spec:
  selector:
    app: chat-backend
  ports:
  - port: 88  # Port extern conform cerinței
    targetPort: 80  # Portul containerului
  type: ClusterIP  # ClusterIP pentru acces doar intern